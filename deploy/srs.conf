# SRS (Simple Realtime Server) configuration for Embassy Radio
# Docs: https://ossrs.net/

listen 1935;
max_connections 1000;
daemon off;
srs_log_tank console;
srs_log_level info;

http_server {
    enabled on;
    listen 1985;
    dir /usr/local/srs/htdocs;
}

http_api {
    enabled on;
    listen 1985;
}

vhost __defaultVhost__ {
    # HLS settings
    hls {
        enabled on;
        hls_path /tmp/srs/hls;
        hls_fragment 2;
        hls_window 10;
        hls_ts_file [app]/[stream]-[seq].ts;
        hls_m3u8_file [app]/[stream].m3u8;
    }

    # Webhooks for publish/unpublish
    http_hooks {
        enabled on;
        on_publish http://backend:3001/srs/hooks/on_publish;
        on_unpublish http://backend:3001/srs/hooks/on_unpublish;
    }

    # CORS
    http_remux {
        enabled on;
    }
}
