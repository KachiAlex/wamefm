# Nginx reverse proxy for Embassy Radio backend
# Routes /hls/* to SRS HTTP server, everything else to the Node.js backend

upstream backend_api {
    server backend:3001;
}

upstream srs_http {
    server srs:1985;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # WebSocket upgrade for Socket.io
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HLS streams — served by SRS HTTP server
    location /hls/ {
        proxy_pass http://srs_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    # SRS API (internal, but proxy for debugging)
    location /srs-api/ {
        proxy_pass http://srs_http/api/v1/;
        proxy_set_header Host $host;
    }

    # Socket.io — needs WebSocket support
    location /socket.io/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # All other API routes
    location / {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
